name: Build APK (debug)

# Setiap push ke main, GitHub membangun APK debug otomatis.
# Hasilnya bisa diunduh di tab Actions > Build APK > Artifacts > app-debug.
# Jadi pemilik HP saja (tanpa laptop) tetap bisa dapat APK-nya.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
